# Optional manual trigger. Production clock is Supabase pg_cron → sync-facts.
#
# Repo secrets (no RAPIDAPI_KEY — that lives in Supabase Edge secrets):
#   NEXT_PUBLIC_SUPABASE_URL   https://<ref>.supabase.co
#   INGEST_SECRET              same as supabase secrets INGEST_SECRET

name: Sync facts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch only — do not write"
        type: boolean
        default: true
      slug:
        description: "Optional tournament slug (e.g. t-atp-21347)"
        type: string
        default: ""
      year:
        description: "Calendar year"
        type: string
        default: ""

concurrency:
  group: sync-facts
  cancel-in-progress: false

jobs:
  sync:
    name: POST sync-facts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Call Edge Function
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          DRY_INPUT: ${{ inputs.dry_run }}
          SLUG_INPUT: ${{ inputs.slug }}
          YEAR_INPUT: ${{ inputs.year }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${INGEST_SECRET:-}" ]; then
            echo "Missing NEXT_PUBLIC_SUPABASE_URL or INGEST_SECRET repo secrets."
            exit 1
          fi
          case "${DRY_INPUT:-false}" in
            true|True|TRUE) DRY_JSON=true ;;
            *) DRY_JSON=false ;;
          esac
          URL="${SUPABASE_URL%/}/functions/v1/sync-facts"
          BODY=$(jq -n \
            --argjson dryRun "${DRY_JSON}" \
            --arg slug "${SLUG_INPUT:-}" \
            --arg year "${YEAR_INPUT:-}" \
            '{dryRun:$dryRun}
              + (if $slug == "" then {} else {slug:$slug} end)
              + (if $year == "" then {} else {year:($year|tonumber)} end)')
          echo "POST $URL dryRun=$DRY_JSON"
          CODE=$(curl -sS -o /tmp/sync-out.json -w "%{http_code}" \
            -X POST "$URL" \
            -H "Authorization: Bearer ${INGEST_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          cat /tmp/sync-out.json
          echo
          test "$CODE" -ge 200 && test "$CODE" -lt 300
