# Publish a verified draw when Tennis API has a complete first round.
# Secrets stay in GitHub — never on Vercel.
#
# Required repo secrets:
#   RAPIDAPI_KEY
#   MATCHREAD_INGEST_URL
#   INGEST_SECRET
#
# Optional (skip already-published events without hitting rebuild-draw):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY

name: Publish complete draws

on:
  schedule:
    # Every 2 hours — Mega quota. Draw drops are time-sensitive.
    - cron: "20 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (fetch + build, no rebuild-draw POST)"
        type: boolean
        default: true

concurrency:
  group: publish-draws
  cancel-in-progress: false

jobs:
  publish:
    name: fixtures → rebuild-draw
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Publish draws (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST || 'tennis-api-atp-wta-itf.p.rapidapi.com' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run publish:draws -- --dry-run

      - name: Publish draws (live)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST || 'tennis-api-atp-wta-itf.p.rapidapi.com' }}
          MATCHREAD_INGEST_URL: ${{ secrets.MATCHREAD_INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$RAPIDAPI_KEY" ] || [ -z "$MATCHREAD_INGEST_URL" ] || [ -z "$INGEST_SECRET" ]; then
            echo "Missing RAPIDAPI_KEY, MATCHREAD_INGEST_URL, or INGEST_SECRET."
            exit 1
          fi
          npm run publish:draws
