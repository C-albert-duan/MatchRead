<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MatchRead — Visual Product Specification — US Open 2026</title>
<meta name="description" content="The visual implementation reference for the MatchRead US Open 2026 web launch." />

<!--
  The three faces the design language names: Archivo (display), Instrument Sans
  (body), IBM Plex Mono (every number). All three are SIL OFL.

  apps/web deliberately does NOT load these yet — self-hosting a licensed
  webfont is a decision with a licence attached, and packages/tokens falls each
  role back to the best system equivalent in the meantime. This specification
  loads them because identity at display sizes is exactly what is being
  specified. Offline, it degrades to the same system stacks production ships,
  which is the honest fallback rather than a broken one.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/spec.css">
</head>
<body>

<div id="root"></div>
<div id="toast-dock" class="toast-dock" aria-live="polite"></div>

<!--
  Classic scripts, loaded in dependency order. Not ES modules: file:// blocks
  module loading under CORS in every browser, and the brief requires this folder
  to open locally with no installation, no backend and no build step.
-->
<script src="js/dom.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/registry.js"></script>
<script src="js/screens.js"></script>
<script src="js/screens-mobile.js"></script>
<script src="js/app.js"></script>

</body>
</html>
