<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MatchRead — Web Wireframe (Phase 1)</title>
<meta name="description" content="Low-fidelity clickable wireframe for the MatchRead web platform. Layout, navigation, hierarchy and primary flows only. Visual design is Phase 2.">
<style>
/* ==========================================================================
   MatchRead web wireframe — Phase 1
   Deliberately low fidelity. Grayscale only. Two muted semantic tokens
   (--ok, --out) exist solely so a live bracket can distinguish a correct
   pick from a busted one, and they are always paired with a text symbol.
   Palette, typography and brand are Phase 2 and are NOT decided here.
   ========================================================================== */

:root{
  --paper:#FFFFFF;
  --stage:#EDEDEA;
  --ink:#1B1B1B;
  --ink2:#5C5C5C;
  --ink3:#8C8C8C;
  --line:#CFCFCA;
  --line2:#E3E3DF;
  --fill:#F4F4F1;
  --fill2:#E9E9E5;
  --ok:#4A7A5E;      /* tiny semantic only — not a brand colour */
  --out:#9C5A50;     /* tiny semantic only — not a brand colour */
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:3px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--stage);
  color:var(--ink);
  font:14px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- review chrome (deliberately subordinate to the product) ------ */
#chrome{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:8px 16px;
  background:#DEDEDA;border-bottom:1px solid #C6C6C1;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#4A4A4A;
}
#chrome .brandline{font-weight:700;letter-spacing:.1em}
#chrome .spacer{flex:1}
.seg{display:inline-flex;border:1px solid #B9B9B4;border-radius:var(--r);overflow:hidden;background:#F4F4F1}
.seg button{
  border:0;background:transparent;padding:4px 10px;cursor:pointer;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#4A4A4A;
}
.seg button + button{border-left:1px solid #CFCFCA}
.seg button[aria-pressed="true"]{background:#3B3B3B;color:#fff}
.chromelink{
  border:1px solid #B9B9B4;background:#F4F4F1;border-radius:var(--r);
  padding:4px 10px;cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  text-decoration:none;display:inline-block;color:#4A4A4A;
}
.chromelink:hover{background:#fff}

/* ---------- stage / frame / notes ---------------------------------------- */
#stage{
  display:flex;gap:20px;align-items:flex-start;justify-content:center;
  padding:20px 16px 64px;
}
#framewrap{flex:1;min-width:0;max-width:1120px}
body[data-vp="mobile"] #framewrap{flex:0 0 auto;max-width:390px}
#frame{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--r);
  overflow:hidden;
  min-height:600px;
}
body[data-vp="mobile"] #frame{
  border-radius:18px;border:8px solid #C9C9C4;
  box-shadow:none;
}
.vpcaption{
  font-size:11px;color:#6E6E6E;text-transform:uppercase;letter-spacing:.08em;
  margin:0 0 6px 2px;
}
#notes{
  flex:0 0 280px;position:sticky;top:56px;
  background:#F7F7F4;border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;font-size:12.5px;line-height:1.55;
}
body[data-notes="off"] #notes{display:none}
@media (max-width:980px){
  #stage{flex-direction:column;align-items:center}
  #notes{position:static;flex:0 0 auto;width:100%;max-width:600px}
}
#notes h3{
  margin:0 0 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:#6E6E6E;font-weight:700;
}
#notes dt{
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#8C8C8C;
  margin-top:11px;font-weight:700;
}
#notes dt:first-of-type{margin-top:0}
#notes dd{margin:2px 0 0}
#notes ul{margin:3px 0 0;padding-left:16px}
#notes li{margin:2px 0}

/* ---------- product chrome ----------------------------------------------- */
.topbar{
  display:flex;align-items:center;gap:20px;
  padding:12px 20px;border-bottom:1px solid var(--line);
}
.topnav{display:flex;gap:18px;flex:1}
.topnav a{
  text-decoration:none;font-size:13px;color:var(--ink2);
  padding-bottom:2px;border-bottom:2px solid transparent;
}
.topnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logomark{
  width:26px;height:26px;border:1px solid var(--line);background:var(--fill);
  border-radius:var(--r);flex:0 0 auto;
}
.logotext{font-weight:700;letter-spacing:-.01em;font-size:15px}
.context{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 20px;background:var(--fill);border-bottom:1px solid var(--line2);
  font-size:12px;color:var(--ink2);
}
.context strong{color:var(--ink)}
.tabbar{
  display:flex;border-top:1px solid var(--line);
  position:sticky;bottom:0;background:var(--paper);
}
.tabbar a{
  flex:1;text-align:center;padding:9px 4px 10px;text-decoration:none;
  font-size:10px;letter-spacing:.04em;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.tabbar a[aria-current="page"]{color:var(--ink);font-weight:700}
.page{padding:20px}
body[data-vp="mobile"] .page{padding:16px}
.footer{
  padding:16px 20px;border-top:1px solid var(--line2);
  font-size:11.5px;color:var(--ink3);display:flex;gap:14px;flex-wrap:wrap;
}

/* ---------- primitives ---------------------------------------------------- */
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:24px;line-height:1.2}
h2{font-size:17px}
h3{font-size:14px}
p{margin:0}
.stack{display:flex;flex-direction:column}
.stack>*+*{margin-top:var(--g,12px)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--ink2)}
.dim{color:var(--ink3)}
.small{font-size:12px}
.tiny{font-size:11px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);font-weight:700;
}
.cols{display:grid;gap:16px}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:repeat(3,1fr)}
.main-rail{display:grid;grid-template-columns:1fr 300px;gap:16px}
body[data-vp="mobile"] .cols,
body[data-vp="mobile"] .main-rail{grid-template-columns:1fr}
@media (max-width:760px){.cols,.main-rail{grid-template-columns:1fr}}

.card{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:14px 16px}
.card.pad0{padding:0}
.card.quiet{background:var(--fill)}
.card.dash{border-style:dashed}
.cardhead{
  padding:11px 16px;border-bottom:1px solid var(--line2);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.cardbody{padding:14px 16px}
.hr{height:1px;background:var(--line2);border:0;margin:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  padding:9px 14px;border-radius:var(--r);cursor:pointer;text-decoration:none;
  font-size:13px;min-height:40px;
}
.btn:hover{background:var(--fill)}
.btn.primary{background:#2E2E2E;border-color:#2E2E2E;color:#fff;font-weight:600}
.btn.primary:hover{background:#454545}
.btn.block{width:100%}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12px}
.btn[aria-disabled="true"]{opacity:.42;cursor:not-allowed;pointer-events:none}

.input{
  width:100%;border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;font:inherit;background:var(--paper);min-height:40px;
}
.label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px}
.field+.field{margin-top:14px}
.choice{
  display:flex;gap:10px;align-items:flex-start;
  border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;cursor:pointer;
}
.choice+.choice{margin-top:8px}
.choice[data-on="1"]{border-color:var(--ink);background:var(--fill)}
.radio{
  width:15px;height:15px;border:1px solid var(--ink3);border-radius:50%;
  flex:0 0 auto;margin-top:2px;position:relative;
}
.choice[data-on="1"] .radio{border-color:var(--ink)}
.choice[data-on="1"] .radio::after{
  content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink);
}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--line);border-radius:20px;padding:2px 9px;
  font-size:11px;color:var(--ink2);background:var(--paper);white-space:nowrap;
}
.chip.solid{background:var(--fill2);border-color:var(--fill2);color:var(--ink)}
.chip.ink{background:#2E2E2E;border-color:#2E2E2E;color:#fff}

.ph{ /* placeholder box with the classic wireframe cross */
  border:1px solid var(--line);background:
    linear-gradient(to top right,transparent 49.6%,var(--line) 49.6%,var(--line) 50.4%,transparent 50.4%),
    linear-gradient(to top left,transparent 49.6%,var(--line) 49.6%,var(--line) 50.4%,transparent 50.4%),
    var(--fill);
  border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
}
.av{
  width:26px;height:26px;border-radius:50%;background:var(--fill2);
  border:1px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:700;color:var(--ink2);letter-spacing:.02em;
}
.av.lg{width:44px;height:44px;font-size:13px}
.av.sm{width:20px;height:20px;font-size:8px}
.avstack{display:flex}
.avstack .av{margin-left:-7px;box-shadow:0 0 0 2px var(--paper)}
.avstack .av:first-child{margin-left:0}

.bar{height:6px;background:var(--fill2);border-radius:20px;overflow:hidden}
.bar>i{display:block;height:100%;background:#6E6E6E}

table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);
}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr[data-you="1"]{background:var(--fill)}
tr[data-you="1"] td{font-weight:600}
.tnum{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}

.listrow{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--line2);text-decoration:none;
}
.listrow:last-child{border-bottom:0}
a.listrow:hover{background:var(--fill)}
.grow{flex:1;min-width:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.steps{counter-reset:s;display:grid;gap:14px}
.step{display:flex;gap:12px}
.stepnum{
  width:24px;height:24px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  font-family:var(--mono);font-size:11px;color:var(--ink2);
}
.icon{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.5}
.delta-up::before{content:"\25B2 ";font-size:9px}
.delta-dn::before{content:"\25BC ";font-size:9px}
.mk{font-family:var(--mono);font-size:12px}
.mk.ok{color:var(--ok)}
.mk.out{color:var(--out)}

/* ---------- bracket ------------------------------------------------------- */
.brackethead{
  position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--line);padding:10px 20px;
}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:8px 20px 0}
.tab{
  border:1px solid var(--line);border-bottom:0;background:var(--fill);
  padding:6px 12px;border-radius:var(--r) var(--r) 0 0;cursor:pointer;
  font-size:12px;color:var(--ink2);text-decoration:none;
}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:600}
.gridwrap{overflow-x:auto;padding:0 20px 20px;border-top:1px solid var(--line)}
.bgrid{display:flex;gap:22px;min-width:760px;padding-top:14px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:10px;flex:1;min-width:150px}
.bcolhead{
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
  font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--line2);margin-bottom:4px;
}
.match{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.match[data-open="1"]{border-style:dashed;border-color:var(--ink3)}
.match[data-empty="1"]{background:var(--fill);border-style:dashed}
.slot{
  display:flex;align-items:center;gap:8px;padding:6px 8px;width:100%;
  border:0;background:transparent;cursor:pointer;text-align:left;
}
.slot+.slot{border-top:1px solid var(--line2)}
.slot:hover{background:var(--fill)}
.slot[data-picked="1"]{background:var(--fill2);font-weight:600}
.slot[data-dead="1"]{color:var(--ink3)}
.slot[data-dead="1"] .pname{text-decoration:line-through}
.seed{font-family:var(--mono);font-size:10px;color:var(--ink3);width:20px;flex:0 0 auto}
.pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.pctry{font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.pick{width:13px;height:13px;border:1px solid var(--ink3);border-radius:50%;flex:0 0 auto;position:relative}
.slot[data-picked="1"] .pick{border-color:var(--ink)}
.slot[data-picked="1"] .pick::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--ink)}
.slot[data-ro="1"]{cursor:default}
.slot[data-ro="1"]:hover{background:transparent}
.slot[data-picked="1"][data-ro="1"]{background:var(--fill2)}

.mcard{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.mcard .mchead{
  padding:5px 10px;background:var(--fill);border-bottom:1px solid var(--line2);
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
  display:flex;justify-content:space-between;
}
.mcard .slot{padding:11px 10px}
.stickytop{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.stickybot{position:sticky;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink3);padding:12px 20px 0}

/* ---------- screen index --------------------------------------------------- */
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.idxcard{
  border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;
  text-decoration:none;display:block;
}
.idxcard:hover{background:var(--fill)}
.idxcard .n{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.statebar{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  padding:7px 20px;background:#F7F7F4;border-bottom:1px solid var(--line2);
}
.statebar .lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.statebtn{
  border:1px solid var(--line);background:var(--paper);border-radius:20px;
  padding:3px 10px;font-size:11px;cursor:pointer;color:var(--ink2);
}
.statebtn[aria-pressed="true"]{background:#2E2E2E;border-color:#2E2E2E;color:#fff}
</style>
</head>
<body data-vp="desktop" data-notes="on">

<div id="chrome">
  <span class="brandline">MatchRead · Web Wireframe</span>
  <span style="text-transform:none;letter-spacing:0">Phase 1 — layout &amp; flow only</span>
  <span class="spacer"></span>
  <a class="chromelink" href="#/index">All screens</a>
  <span class="seg" role="group" aria-label="Viewport">
    <button type="button" data-vp="desktop">Desktop</button>
    <button type="button" data-vp="mobile">Mobile</button>
  </span>
  <span class="seg" role="group" aria-label="Annotations">
    <button type="button" data-notes="on">Notes on</button>
    <button type="button" data-notes="off">Off</button>
  </span>
</div>

<div id="stage">
  <div id="framewrap">
    <p class="vpcaption" id="vpcaption"></p>
    <div id="frame"><div id="app"></div></div>
  </div>
  <aside id="notes" aria-label="Screen annotation"></aside>
</div>

<script>
/* =========================================================================
   Wireframe runtime. No data layer, no persistence, no network.
   Picks are held in memory so the bracket feels real when clicked through.
   ========================================================================= */
(function(){
'use strict';

/* ---------- placeholder content --------------------------------------- */
/* Deliberately invented surnames. This is not a real draw. */
var DRAW = [
  ['RIVERA','ESP',1],   ['HALVORSEN','NOR',null],
  ['OKONKWO','NGA',null],['BRENNAN','IRL',28],
  ['TANAKA','JPN',17],  ['DUBOIS','FRA',null],
  ['PETROV','BUL',null],['WHITFIELD','GBR',12],
  ['SANTOS','BRA',9],   ['LINDQVIST','SWE',null],
  ['AL-FARSI','UAE',null],['ESPOSITO','ITA',24],
  ['MULLER','GER',5],   ['NAKAMURA','JPN',null],
  ['KOVACS','HUN',null],['DELACROIX','BEL',31]
];
var LEAGUE = 'Baseline Club';
var MEMBERS = [
  {n:'You',            i:'YO', joined:'12 Aug', st:'submitted', rank:3, score:148, mv:2,  you:true},
  {n:'Maya Okonkwo',   i:'MO', joined:'8 Aug',  st:'submitted', rank:1, score:186, mv:0,  comm:true},
  {n:'Theo Brennan',   i:'TB', joined:'9 Aug',  st:'submitted', rank:2, score:171, mv:1},
  {n:'Priya Raman',    i:'PR', joined:'10 Aug', st:'submitted', rank:4, score:140, mv:-2},
  {n:'Sam Delacroix',  i:'SD', joined:'10 Aug', st:'submitted', rank:4, score:140, mv:0},
  {n:'Jonas Lindqvist',i:'JL', joined:'11 Aug', st:'progress',  rank:6, score:122, mv:-1},
  {n:'Ana Costa',      i:'AC', joined:'14 Aug', st:'submitted', rank:7, score:118, mv:3},
  {n:'Ravi Menon',     i:'RM', joined:'15 Aug', st:'none',      rank:null,score:null,mv:null}
];
var LEAGUES = [
  {n:'Baseline Club',  m:14, rank:3, of:14, st:'Submitted'},
  {n:'Office — 3rd Floor', m:22, rank:9, of:22, st:'Submitted'},
  {n:'Family',         m:5,  rank:2, of:5,  st:'Submitted'}
];
var TOTAL = 127;
var STATUS_LABEL = {none:'Not started', progress:'In progress', submitted:'Submitted'};

/* ---------- in-memory pick store -------------------------------------- */
/* Q1 is modelled as a real 8→4→2→1 tree so the interaction is honest.  */
var store = { picks:{}, seeded:null, base:0, prefill:0 };

function matchIds(){
  var ids=[],r,i,n=8;
  for(r=0;r<4;r++){ for(i=0;i<n;i++) ids.push('r'+r+'m'+i); n=n/2; }
  return ids;
}
var MATCH_IDS = matchIds();

function seedPicks(kind){
  if(store.seeded===kind) return;
  store.seeded=kind; store.picks={};
  var fillTo = {empty:0, partial:9, complete:15, live:15}[kind];
  if(fillTo===undefined) fillTo=0;
  MATCH_IDS.slice(0,fillTo).forEach(function(id,ix){ store.picks[id]= ix%3===0 ?1:0; });
  store.base   = {empty:0, partial:54, complete:TOTAL, live:TOTAL}[kind] || 0;
  store.prefill= fillTo;
}
function pickedCount(){ return Object.keys(store.picks).length; }
function overall(){
  var n = store.base + (pickedCount() - store.prefill);
  return Math.max(0, Math.min(TOTAL, n));
}

/* Resolve who occupies a slot, following picks forward through the tree. */
function competitor(round, idx, side){
  if(round===0) return DRAW[idx*2+side] || null;
  var prev='r'+(round-1)+'m'+(idx*2+side);
  var p=store.picks[prev];
  if(p===undefined) return null;
  return competitor(round-1, idx*2+side, p);
}

/* ---------- helpers ---------------------------------------------------- */
function h(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function av(initials, cls){ return '<span class="av '+(cls||'')+'" aria-hidden="true">'+h(initials)+'</span>'; }
function initials(name){
  if(name==='You') return 'YO';
  return name.split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
}
function bar(pct){ return '<span class="bar"><i style="width:'+Math.max(0,Math.min(100,pct))+'%"></i></span>'; }
function delta(d){
  if(d===null||d===undefined) return '<span class="dim num">—</span>';
  if(d===0) return '<span class="dim num">—</span>';

function tabbar(active){

}
var DRAWS = ["Men's Singles", "Women's Singles"];
var curDraw = 0;

/* The strip changes with the tournament phase: countdown, then round, then result. */
function contextbar(phase){
  phase = phase || 'pre';
  var right =
    phase==='live' ? '<span>Round of 16 under way</span>' :
    phase==='done' ? '<span>Final results · RIVERA won</span>' :
                     '<span class="num">Locks Sun 30 Aug, 11:00 ET · 3d 04h</span>';
  return '<div class="context">'+icon(phase==='pre'?'clock':'trophy')+
    '<strong>US Open 2026</strong><span>·</span><span>'+h(DRAWS[curDraw])+'</span>'+
    '<span class="grow"></span>'+right+'</div>';
}

/* Hidden automatically when a tournament has only one draw. */
function drawSelector(){
  if(DRAWS.length<2) return '';
  return '<span class="row" style="gap:6px">'+DRAWS.map(function(d,i){
    return '<button class="statebtn" type="button" data-draw="'+i+'" aria-pressed="'+(i===curDraw)+'">'+

}

  return '<div class="footer"><span>Free to play. No entry fees. No wagering.</span>'+
    '<span class="grow"></span><span>Rules</span><span>Privacy</span><span>Contact</span></div>';

/* =========================================================================
   BRACKET RENDERING
   A reduced but structurally honest tree: 8 → 4 → 2 → 1 for one quarter.
   Enough to communicate composition without pretending to be a draw engine.
   ========================================================================= */
var ROUNDS = [
  {label:'Round of 128', n:8, note:'8 of 16 shown'},
  {label:'Round of 64',  n:4},
  {label:'Round of 32',  n:2},
  {label:'Round of 16',  n:1}
];
var QUARTERS = ['Quarter 1','Quarter 2','Quarter 3','Quarter 4','Final four'];
/* Results only exist in the live state. */
var RESULTS = {r0m0:0,r0m1:0,r0m2:1,r0m3:0,r0m4:0,r0m5:1,r0m6:0,r0m7:1,
               r1m0:0,r1m1:1,r1m2:0,r1m3:1};
var curRound = 0;

function isOut(name, live){
  if(!live||!name) return false;
  for(var r=0;r<2;r++){
    for(var i=0;i<ROUNDS[r].n;i++){
      var mid='r'+r+'m'+i, w=RESULTS[mid];
      if(w===undefined) continue;
      var loser=competitor(r,i,1-w);
      if(loser && loser[0]===name) return true;
    }
  }
  return false;
}

function slot(mid, round, idx, side, opts){
  var p = competitor(round, idx, side);
  var picked = store.picks[mid]===side;
  var live = opts.live, ro = opts.readonly;
  var res = live ? RESULTS[mid] : undefined;
  var mark='';
  if(res!==undefined && picked) mark = res===side
    ? '<span class="mk ok" title="Correct">&#10003;</span>'
    : '<span class="mk out" title="Wrong">&#10007;</span>';
  if(!p){
    return '<span class="slot" data-ro="1"><span class="seed"></span>'+
      '<span class="pname dim">Winner of previous round</span></span>';
  }
  var dead = isOut(p[0], live);
  return '<'+(ro?'span':'button')+' class="slot"'+
    (ro?' data-ro="1"':' type="button" data-mid="'+mid+'" data-side="'+side+'"')+
    (picked?' data-picked="1"':'')+(dead?' data-dead="1"':'')+'>'+
    '<span class="seed">'+(p[2]?p[2]:'')+'</span>'+
    '<span class="av sm" aria-hidden="true"></span>'+
    '<span class="pname">'+h(p[0])+'</span>'+
    '<span class="pctry">'+h(p[1])+'</span>'+
    (mark||'')+
    (ro?'':'<span class="pick"></span>')+
    '</'+(ro?'span':'button')+'>';
}

function matchBox(round, idx, opts){
  var mid='r'+round+'m'+idx;
  var a=competitor(round,idx,0), b=competitor(round,idx,1);
  var known = a&&b;
  var open = known && store.picks[mid]===undefined;
  return '<div class="match"'+(open?' data-open="1"':'')+(known?'':' data-empty="1"')+'>'+
    slot(mid,round,idx,0,opts)+slot(mid,round,idx,1,opts)+'</div>';
}

function bracketGrid(opts){
  return '<div class="gridwrap"><div class="bgrid">'+ROUNDS.map(function(R,ri){
    var boxes='';
    for(var i=0;i<R.n;i++) boxes+=matchBox(ri,i,opts);
    return '<div class="bcol"><div class="bcolhead">'+R.label+
      (R.note?' <span style="text-transform:none;letter-spacing:0">('+R.note+')</span>':'')+
      '</div>'+boxes+'</div>';
  }).join('')+'</div></div>';
}

function quarterTabs(active){
  return '<div class="tabs">'+QUARTERS.map(function(q,i){
    return '<a class="tab" href="#/'+ (state.id||'bracket') + (state.st?'/'+state.st:'') +
      '" aria-selected="'+(i===(active||0))+'">'+q+'</a>';
  }).join('')+'</div>';
}

        <div class="stack" style="--g:2px"><p class="eyebrow">League finish</p><p class="num" style="font-size:22px">2nd</p><p class="tiny dim">of 14, in a private league</p></div>
        <div class="stack" style="--g:2px"><p class="eyebrow">Champion pick</p><p style="font-size:15px"><strong>RIVERA</strong></p></div>
      </div>
    </div>

    <div class="card pad0">
      <div class="cardhead"><strong>How the bracket finished</strong></div>
      <div class="cardbody stack" style="--g:12px">
        <div class="row"><span class="small dim" style="width:96px">Champion</span>
          `+av('RI')+`<strong class="small">RIVERA</strong><span class="mk ok">&#10003;</span></div>
        <div class="row"><span class="small dim" style="width:96px">Finalist</span>
          `+av('TA')+`<span class="small">TANAKA</span><span class="mk out">&#10007;</span></div>
        <div class="row"><span class="small dim" style="width:96px">Semi-finals</span>
          <span class="small">OKONKWO, WHITFIELD</span></div>
        <hr class="hr">
        `+[['Round of 128',88],['Round of 64',75],['Round of 32',62],['Round of 16',50],['Quarter-final',50],['Semi-final',50]].map(function(r){
          return '<div class="row"><span class="small" style="width:104px">'+r[0]+'</span>'+
            '<span class="grow">'+bar(r[1])+'</span>'+
            '<span class="num tiny" style="width:34px;text-align:right">'+r[1]+'%</span></div>';
        }).join('')+`
      </div>
    </div>

    <div class="card dash row">`+icon('users')+`<span class="tiny dim">Private league details, member
    names and other players' brackets are never shown on a public page.</span></div>
  </div>
  <div class="page" style="padding-top:0">
    <div class="card stack" style="--g:10px">
      <h2>Fill in your own</h2>
      <p class="muted small">One bracket, counted in every league you join — and you don't need a
      league to start. Free, no entry fees, no wagering.</p>
      <div class="row">`+btn('Create your bracket','#/signin',{primary:true})+btn('How it works','#/landing',{})+`</div>

  </div>`+footer();
}});

/* ---- Screen index (review aid, not part of the product) ---------------- */
screen({
id:'index', n:0, title:'All screens', group:'Review',
note:{
  purpose:'A review aid for the founder and the launch engineer. Not a product screen.',
  primary:'Open any screen',
  shows:['All 18 screens, grouped'],
  from:'The grey bar above the frame.',
  leads:'Anywhere.',
  impl:['Delete this screen when the wireframe has served its purpose.']
},
render:function(){
  var groups={};
  S.forEach(function(s){ if(s.id==='index') return; (groups[s.group]=groups[s.group]||[]).push(s); });
  return '<div class="page stack" style="--g:20px">'+
    '<div class="stack" style="--g:5px"><h1 style="font-size:21px">MatchRead web wireframe</h1>'+
    '<p class="muted small">18 screens. Low fidelity on purpose — layout, hierarchy and flow only. '+
    'Colour, type and branding are Phase 2.</p></div>'+
    Object.keys(groups).map(function(g){
      return '<div class="stack" style="--g:9px"><p class="eyebrow">'+h(g)+'</p><div class="idx">'+
        groups[g].map(function(s){
          var first = s.states? s.states[0] : '';
          return '<a class="idxcard" href="'+href(s.id,first)+'">'+
            '<span class="n">'+String(s.n).padStart(2,'0')+'</span>'+
            '<div style="margin-top:3px"><strong class="small">'+h(s.title)+'</strong></div>'+
            (s.states?'<div class="tiny dim" style="margin-top:3px">'+s.states.length+' states</div>':'')+
            '</a>';
        }).join('')+'</div></div>';
    }).join('')+
    '<div class="card dash stack" style="--g:8px"><p class="eyebrow">Click-through journeys</p>'+
    '<p class="small"><strong>New user</strong> — '+
      '<a href="#/landing">Landing</a> › <a href="#/tournament/signed-out">Tournament</a> › '+
      '<a href="#/signin/email">Sign in</a> › <a href="#/bracket-intro">Intro</a> › '+
      '<a href="#/bracket/empty">Bracket</a> › <a href="#/review/complete">Review</a> › '+
      '<a href="#/submitted/no-leagues">Submit</a> › <a href="#/create-league">Create or join league</a> › '+
      '<a href="#/public">Share</a></p>'+
    '<p class="small"><strong>Invited user</strong> — '+
      '<a href="#/invite/signin-required">Invitation</a> › <a href="#/signin/from-invite">Sign in</a> › '+
      '<a href="#/invite/joined">Joined</a> › <a href="#/league/before-results">League</a> › '+
      '<a href="#/bracket/partial">Bracket</a>'+
      ' <span class="dim">(after lock: <a href="#/invite/after-lock">entry closed</a>)</span></p>'+
    '<p class="small"><strong>Returning user</strong> — '+
      '<a href="#/home/active">Home</a> › <a href="#/daily/movement">Daily Check</a> › '+
      '<a href="#/standings/tournament">Standings</a> › <a href="#/live">Live bracket</a> › '+
      '<a href="#/profile">Profile</a></p></div>'+
  '</div>';
}});

/* =========================================================================
   ROUTER + CHROME
   ========================================================================= */
var byId={}; S.forEach(function(s){ byId[s.id]=s; });
var state = { id:'landing', st:null, vp:'desktop', notes:true };

function parse(){
  var p=(location.hash||'#/landing').replace(/^#\/?/,'').split('/');
  var id=p[0]||'landing';
  if(!byId[id]) id='landing';
  var s=byId[id];
  var st=p[1]||(s.states?s.states[0]:null);
  if(s.states && s.states.indexOf(st)<0) st=s.states[0];
  return {id:id, st:st};
}

function renderNotes(s){
  var n=s.note||{};
  var el=document.getElementById('notes');
  el.innerHTML='<h3>'+String(s.n).padStart(2,'0')+' · '+h(s.title)+'</h3><dl>'+
    '<dt>Purpose</dt><dd>'+h(n.purpose)+'</dd>'+
    '<dt>Primary action</dt><dd>'+h(n.primary)+'</dd>'+
    '<dt>Key information</dt><dd><ul>'+(n.shows||[]).map(function(x){return '<li>'+h(x)+'</li>';}).join('')+'</ul></dd>'+
    '<dt>Arrives from</dt><dd>'+h(n.from)+'</dd>'+
    '<dt>Primary action leads to</dt><dd>'+h(n.leads)+'</dd>'+
    '<dt>Implementation notes</dt><dd><ul>'+(n.impl||[]).map(function(x){return '<li>'+h(x)+'</li>';}).join('')+'</ul></dd>'+
    '</dl>';
}

function stateBar(s){
  if(!s.states) return '';
  return '<div class="statebar"><span class="lbl">State</span>'+s.states.map(function(x){
    return '<a class="statebtn" href="'+href(s.id,x)+'" aria-pressed="'+(x===state.st)+'">'+
      h((s.stateLabels&&s.stateLabels[x])||x)+'</a>';
  }).join('')+'</div>';
}

function render(){
  var r=parse();
  var s=byId[r.id];
  state.id=r.id; state.st=r.st;
  if(s.forceMobile) state.vp='mobile';
  document.body.dataset.vp=state.vp;
  document.body.dataset.notes=state.notes?'on':'off';
  document.getElementById('app').innerHTML = stateBar(s) + s.render(r.st);
  renderNotes(s);
  document.getElementById('vpcaption').textContent =
    (state.vp==='mobile'?'Mobile browser · 390px':'Desktop · up to 1120px') +
    ' — ' + String(s.n).padStart(2,'0') + ' ' + s.title +
    (r.st? ' · ' + ((s.stateLabels&&s.stateLabels[r.st])||r.st) : '');
  document.querySelectorAll('#chrome [data-vp]').forEach(function(b){
    b.setAttribute('aria-pressed', b.dataset.vp===state.vp);
  });
  document.querySelectorAll('#chrome [data-notes]').forEach(function(b){
    b.setAttribute('aria-pressed', b.dataset.notes===(state.notes?'on':'off'));
  });
  try{ document.getElementById('frame').scrollIntoView({block:'nearest'}); }catch(e){}
}

/* ---- interaction ------------------------------------------------------- */
document.addEventListener('click', function(e){
  var vpb=e.target.closest('#chrome [data-vp]');
  if(vpb){ state.vp=vpb.dataset.vp; render(); return; }
  var nb=e.target.closest('#chrome [data-notes]');
  if(nb){ state.notes = nb.dataset.notes==='on'; render(); return; }

  var sl=e.target.closest('.slot[data-mid]');
  if(sl){
    var mid=sl.dataset.mid, side=+sl.dataset.side;
    if(store.picks[mid]===side) delete store.picks[mid];
    else store.picks[mid]=side;
    /* clearing a pick invalidates everything downstream of it */
    var m=/^r(\d+)m(\d+)$/.exec(mid), rr=+m[1], ii=+m[2];
    for(var r2=rr+1;r2<ROUNDS.length;r2++){
      ii=Math.floor(ii/2);
      var nxt='r'+r2+'m'+ii;
      var a=competitor(r2,ii,0), b=competitor(r2,ii,1);
      if(store.picks[nxt]!==undefined){
        var kept=competitor(r2,ii,store.picks[nxt]);
        if(!kept) delete store.picks[nxt];
      }
    }
    render(); return;
  }

  var db=e.target.closest('[data-draw]');
  if(db){ curDraw=+db.dataset.draw; render(); return; }

  var rb=e.target.closest('[data-round]');
  if(rb && rb.getAttribute('aria-disabled')!=='true'){
    var n=+rb.dataset.round;
    if(n>=0 && n<ROUNDS.length){ curRound=n; render(); }
    return;
  }

  if(e.target.closest('#nextunpicked')){
    for(var r=0;r<ROUNDS.length;r++){
      for(var i=0;i<ROUNDS[r].n;i++){
        var id='r'+r+'m'+i;
        if(store.picks[id]===undefined && competitor(r,i,0) && competitor(r,i,1)){
          curRound=r; render(); return;
        }
      }
    }
    location.hash='#/review/complete';
    return;
  }

  var ch=e.target.closest('.choice');
  if(ch){
    ch.parentNode.querySelectorAll('.choice').forEach(function(c){ c.dataset.on='0'; });
    ch.dataset.on='1';
    return;
  }
});

window.addEventListener('hashchange', render);
if(!location.hash) location.hash='#/landing';
render();

/* exposed only so the wireframe can be sanity-checked in a headless browser */
window.WF = { screens:S, state:state, go:function(h){ location.hash=h; }, store:store };
})();
</script>
